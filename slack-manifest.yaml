# Agent Stack Slack app: read-only permissions.
# Setup: api.slack.com/apps -> Create New App -> From a manifest -> paste this file.
display_information:
  name: agentstack-bot
  description: Agent Stack demo bot (read only)
features:
  bot_user:
    display_name: agentstack-bot
    always_online: false
oauth_config:
  scopes:
    bot:
      - channels:read
      - channels:history
      - groups:read
      - groups:history
      - users:read
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
